[package]
name = "deadpool-baseline"
version = "0.0.0"
edition = "2024"
description = "The tokio + deadpool counterpart to compio-pool's ncat benchmarks, for comparison"
license = "MIT OR Apache-2.0"
repository = "https://github.com/artech-git/compio-pool"
rust-version = "1.88"
# A yardstick, not a product. Nothing here is meant to be released.
publish = false

[dev-dependencies]
# `rt_tokio_1` is what makes `wait_timeout` possible: deadpool refuses to build
# a pool with timeouts configured and no runtime to arm them with.
deadpool = { version = "0.13", features = ["rt_tokio_1"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
