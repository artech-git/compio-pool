[package]
name = "compio-pool"
version = "0.1.0"
edition = "2024"
description = "Thread-per-core io_uring accept server for compio: one SO_REUSEPORT listener per pinned core, a thread-local resource pool, and lock-free fd handoff for overflow"
license = "MIT OR Apache-2.0"
repository = "https://github.com/artech-git/compio-pool"
documentation = "https://docs.rs/compio-pool"
homepage = "https://github.com/artech-git/compio-pool"
readme = "README.md"
keywords = ["compio", "io-uring", "thread-per-core", "reuseport", "server"]
categories = ["asynchronous", "network-programming", "concurrency"]
# Bisected, not guessed: compio 0.19's executor uses `cfg_select!`, stable
# since 1.95. 1.88 through 1.94 fail to build the dependency tree. Enforced by
# the `msrv` job in CI.
rust-version = "1.95"

# docs.rs builds with `--cfg docsrs` so `#[doc(cfg(...))]` renders. The crate
# only supports Linux, so only Linux targets are built there.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[workspace]
members = []
# A nested repository with its own history. It targets the previous API and is
# not part of this build.
exclude = ["crates/compio-redis"]

[dependencies]
# `default-features = false` drops `io-uring`, which is the whole point, so it
# is named explicitly. `time` is for the drain timeout and accept back-off,
# `io` for the AsyncRead/AsyncWrite traits the examples and tests use.
compio = { version = "0.19.2", default-features = false, features = [
    "runtime",
    "net",
    "io",
    "time",
    "io-uring",
] }
# `all` is what gates `Socket::set_cpu_affinity` (SO_INCOMING_CPU) on Linux.
socket2 = { version = "0.6.5", features = ["all"] }
core_affinity = "0.8.3"
# Only the async API is used; `select` and `eventual-fairness` are not.
flume = { version = "0.12.0", default-features = false, features = ["async"] }
