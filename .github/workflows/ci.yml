name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The crate is Linux-only: SO_REUSEPORT load balancing, io_uring and the IRQ
# affinity recipe are all Linux semantics. Every job here runs on Ubuntu.
env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The default build and each optional feature are separate code paths, so
      # lint them all — a lint only one configuration trips is still a failure.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --features affinity --locked -- -D warnings
      - run: cargo clippy --all-targets --features metrics --locked -- -D warnings
      # Both features at once: they share code (the metrics counters run inside the
      # affinity harness's workers), so the combination is its own configuration.
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    env:
      # Stable has to stay warning-clean; beta is early warning for test
      # failures, not for a lint that does not exist on stable yet.
      RUSTFLAGS: ${{ matrix.toolchain == 'stable' && '-D warnings' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # The steps below are the default build (all optional features off); the
      # per-feature steps after them are the feature-on paths. Each must stay
      # green — nothing else exercises these configurations against each other.
      - name: Build (all targets, incl. examples)
        run: cargo build --all-targets --locked
      # The integration tests bind SO_REUSEPORT listeners on 127.0.0.1 and
      # drive them through io_uring, which the hosted runners' kernels allow.
      - name: Test
        run: cargo test --all-targets --locked
      - name: Doc tests
        run: cargo test --doc --locked
      - name: Build (affinity)
        run: cargo build --all-targets --features affinity --locked
      - name: Test (affinity)
        run: cargo test --all-targets --features affinity --locked
      - name: Doc tests (affinity)
        run: cargo test --doc --features affinity --locked
      - name: Build (metrics)
        run: cargo build --all-targets --features metrics --locked
      - name: Test (metrics)
        run: cargo test --all-targets --features metrics --locked
      - name: Doc tests (metrics)
        run: cargo test --doc --features metrics --locked
      # Both features together — nothing else exercises affinity and metrics in
      # the same build, and they share code.
      - name: Build (all features)
        run: cargo build --all-targets --all-features --locked
      - name: Test (all features)
        run: cargo test --all-targets --all-features --locked
      - name: Doc tests (all features)
        run: cargo test --doc --all-features --locked

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in Cargo.toml and the note in README.md.
      # 1.95 is where `cfg_select!`, used by compio's executor, became stable.
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # `--lib` only: dev-dependencies do not bind downstream users.
      - run: cargo build --lib --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `--all-features` matches docs.rs (see `[package.metadata.docs.rs]`), so the
      # feature-gated APIs and their `doc(cfg)` annotations are built and checked here too.
      - run: cargo doc --no-deps --all-features --locked

  shell:
    name: Tuning script parses and passes shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck ethtool
      - run: bash -n scripts/tune-nic.sh
      - run: shellcheck scripts/tune-nic.sh
      - run: scripts/tune-nic.sh --self-test
      # `--check` is read-only. It reports the runner NIC's capability and
      # exits 0 or 2; either proves the script runs end to end.
      - run: scripts/tune-nic.sh --check || test $? -eq 2

  links:
    name: Doc cross-links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # README and docs/ link into each other heavily; a renamed file is
      # otherwise invisible until a reader hits the 404. `--offline` checks
      # relative paths only, so this never fails on a flaky external host.
      - uses: lycheeverse/lychee-action@v2
        with:
          # Only this crate's own docs. The `crates/*` sub-projects are excluded
          # from the workspace (see Cargo.toml) and carry their own READMEs, so
          # they must not gate this repo's CI. Both `docs/*.md` and `docs/**/*.md`
          # are listed so top-level docs and nested ones are all covered.
          args: --offline --no-progress --verbose "README.md" "docs/*.md" "docs/**/*.md"
          fail: true
