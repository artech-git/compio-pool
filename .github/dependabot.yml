version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its ref names the toolchain to install, not a version of the action:
      # `@1.95.0` is the MSRV pin, kept in step with `rust-version` in
      # Cargo.toml, so a "bump" to a newer ref would silently move the MSRV.
      - dependency-name: dtolnay/rust-toolchain
